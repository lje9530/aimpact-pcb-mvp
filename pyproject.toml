[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimpact-pcb-mvp"
version = "0.2.0"
description = "Local PCB AOI workbench for review and inspection-data mapping"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Flask>=3.1,<4",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "openpyxl>=3.1,<4",
    "Pillow>=10,<13",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
detector = ["ultralytics==8.4.158"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcb_inspection = ["static/*.css", "static/*.js", "templates/*.html"]
